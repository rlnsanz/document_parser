<!-- app/templates/label_pdf.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Label PDF</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            font-size: 1.1rem;
            line-height: 1.7;
            background: #f9fafb;
            margin: 0;
            padding: 24px;
        }

        .content {
            display: flex;
            gap: 2.5rem;
            margin-bottom: 20px;
            /* Make the layout span the viewport and allow the right column to grow */
            width: calc(100vw - 48px);
            /* account for body padding */
            box-sizing: border-box;
            align-items: stretch;
        }

        .pdf-container {
            position: relative;
            overflow: visible;
            /* Keep PDF column bounded so metadata can expand to the right */
            flex: 0 0 auto;
            max-width: 60vw;
            width: auto;
            /* ensure pdf wrapper/canvas can fill the parent's height */
            display: flex;
            flex-direction: column;
            align-items: stretch;
            height: 100%;
        }

        .pdf-container canvas {
            width: auto;
            /* fill vertical space */
            height: 100%;
            display: block;
        }

        /* Make metadata column flexible and horizontally resizable */
        .metadata {
            flex: 1 1 0;
            min-width: 260px;
            max-width: calc(100vw - 320px);
            padding: 1.25rem 1.5rem;
            box-sizing: border-box;
            overflow: auto;
            resize: horizontal;

            /* make metadata a column so child fields can grow to fill height */
            display: flex;
            flex-direction: column;
            min-height: 0;
            height: 100%;
        }

        /* Let the first meta-field grow to match PDF height; others size to content */
        .metadata .meta-field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-bottom: 1rem;
        }

        .metadata .meta-field:first-child {
            flex: 1 1 auto;
            min-height: 0;
        }

        .metadata .meta-field:not(:first-child) {
            flex: 0 0 auto;
        }

        /* textarea in the first field fills available vertical space */
        .metadata .meta-field:first-child textarea {
            height: 100%;
            resize: vertical;
            min-height: 0;
        }

        .metadata .meta-field:not(:first-child) textarea {
            resize: vertical;
        }


        /* Styles for overlay */
        .page-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(118, 42, 131, 0.2);
            /* Example overlay color */
        }

        /* Style for the save and close button */
        #save-close-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
</head>

<body>
    <button id="save-close-btn">Save & Close</button>
    <script type="module">
        import * as pdfjsLib from "{{ url_for('static', filename='js/pdf.mjs') }}";

        pdfjsLib.GlobalWorkerOptions.workerSrc = "{{ url_for('static', filename='js/pdf.worker.mjs') }}";

        const color_wheel = ['rgba(118, 42, 131, 0.2)', 'rgba(175, 141, 195, 0.2)', 'rgba(231, 212, 232, 0.2)', 'rgba(217, 240, 211, 0.2)', 'rgba(127, 191, 123, 0.2)', 'rgba(27, 120, 55, 0.2)'];

        const _colorIndices = JSON.parse('{{ colors | tojson | safe }}');
        const colorIndices = Array.isArray(_colorIndices) ? _colorIndices : [];

        function getColorForPage(pageIndex) {
            if (!Array.isArray(colorIndices) || !colorIndices.length) return color_wheel[0];
            const idx = colorIndices[pageIndex] ?? 0;
            return color_wheel[idx % color_wheel.length];
        }

        // Helper: render one page at high pixel density but fixed CSS width
        async function renderPageInto(page, targetCssWidth, containerEl, pageIndex) {
            const baseViewport = page.getViewport({ scale: 1 });
            const cssScale = targetCssWidth / baseViewport.width;

            // High-DPI rendering: multiply by devicePixelRatio for crispness
            const dpr = window.devicePixelRatio || 1;
            const renderScale = cssScale * dpr;

            const viewportCSS = page.getViewport({ scale: cssScale });
            const viewportRender = page.getViewport({ scale: renderScale });

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });

            // Backing store in device pixels
            canvas.width = Math.floor(viewportRender.width);
            canvas.height = Math.floor(viewportRender.height);

            // Display size in CSS pixels (fixed-width frame)
            canvas.style.width = `${Math.floor(viewportCSS.width)}px`;
            canvas.style.height = `${Math.floor(viewportCSS.height)}px`;
            canvas.style.maxWidth = '100%';
            canvas.style.display = 'block';

            // Overlay
            const overlay = document.createElement('div');
            overlay.className = 'page-overlay';
            overlay.style.width = '100%';
            overlay.style.height = '100%';
            overlay.style.backgroundColor = getColorForPage(pageIndex);
            let i = (colorIndices[pageIndex] ?? 0) % color_wheel.length;
            overlay.onclick = () => {
                i = (i + 1) % color_wheel.length;
                overlay.style.backgroundColor = color_wheel[i];

                // Copy high-res PNG from canvas
                canvas.toBlob(blob => {
                    if (!blob) {
                        alert('Could not copy image to clipboard.');
                        return;
                    }
                    navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
                        .catch(err => {
                            console.error('Clipboard copy failed:', err);
                            alert('Could not copy image to clipboard.');
                        });
                }, 'image/png');
            };

            const pdfWrapper = document.createElement('div');
            pdfWrapper.className = 'pdf-container';
            // Fix the frame size in CSS pixels so metadata can match height
            pdfWrapper.style.width = `${Math.floor(viewportCSS.width)}px`;
            pdfWrapper.style.height = `${Math.floor(viewportCSS.height)}px`;
            pdfWrapper.style.overflow = 'visible';

            pdfWrapper.appendChild(canvas);
            pdfWrapper.appendChild(overlay);

            // Render at high DPI
            await page.render({ canvasContext: ctx, viewport: viewportRender }).promise;

            containerEl.appendChild(pdfWrapper);

            // Return CSS height to sync metadata column
            return Math.floor(viewportCSS.height);
        }

        document.getElementById('save-close-btn').addEventListener('click', () => {
            const overlays = document.getElementsByClassName('page-overlay');
            const colors = Array.from(overlays).map(ov => {
                const idx = color_wheel.indexOf(ov.style.backgroundColor);
                return idx >= 0 ? idx : 0;
            });

            // Collect edited metadata
            const pages = [];
            document.querySelectorAll('.metadata').forEach(metaDiv => {
                const pageIdx = parseInt(metaDiv.id.replace('metadata-page-',''), 10);
                const data = {};
                metaDiv.querySelectorAll('textarea[data-key]').forEach(t => {
                    data[t.getAttribute('data-key')] = t.value;
                });
                pages.push({ page: pageIdx, data });
            });

            fetch('/save_colors', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ colors, metadata: pages })
            }).then(r => r.ok && r.json())
              .then(() => window.close())
              .catch(e => console.error('Error saving:', e));
        });

        async function fetchPageMetadata(pageNum) {
            try {
                const r = await fetch("/metadata-for-page/" + pageNum);
                if (!r.ok) throw new Error(r.status);
                return await r.json();
            } catch (e) {
                console.error("Metadata fetch failed:", e);
                return [];
            }
        }

        async function loadPdf() {
            const url = "{{ url_for('static', filename='private/' + pdf_name) }}";
            const pdf = await pdfjsLib.getDocument(url).promise;

            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                const page = await pdf.getPage(pageNum);

                // Fixed-width frame; image renders at DPR for crispness
                const targetWidth = Math.min(window.innerWidth * 0.55, 680);

                const container = document.createElement('div');
                container.className = 'content';

                // Left column: PDF canvas + overlay
                const pdfColumn = document.createElement('div');
                pdfColumn.style.display = 'flex';
                pdfColumn.style.flexDirection = 'column';

                // Render page and get CSS height to match the metadata column
                const cssHeight = await renderPageInto(page, targetWidth, pdfColumn, pageNum - 1);

                // Right column: metadata
                const metadata = await fetchPageMetadata(pageNum - 1);
                const metadataWrapper = document.createElement('div');
                metadataWrapper.className = 'metadata';
                metadataWrapper.id = 'metadata-page-' + pageNum;
                metadataWrapper.style.height = `${cssHeight}px`;
                metadataWrapper.style.display = 'flex';
                metadataWrapper.style.flexDirection = 'column';

                metadata.forEach(item => {
                    Object.entries(item).forEach(([k, v]) => {
                        const field = document.createElement('div');
                        field.className = 'meta-field';
                        field.innerHTML = `
                            <label>${k}</label>
                            <textarea data-key="${k}">${v == null ? '' : v}</textarea>
                        `;
                        metadataWrapper.appendChild(field);
                    });
                });

                const fields = metadataWrapper.querySelectorAll('.meta-field');
                if (fields.length > 1) {
                    fields.forEach((f, i) => {
                        if (i === 0) {
                            f.style.flex = '1 1 auto';
                            f.style.minHeight = '0';
                            const ta = f.querySelector('textarea');
                            ta.style.height = '100%';
                            ta.style.minHeight = '0';
                            ta.style.resize = 'vertical';
                        } else {
                            f.style.flex = '0 0 auto';
                            const ta = f.querySelector('textarea');
                            ta.style.height = 'auto';
                            ta.style.resize = 'vertical';
                        }
                    });
                    metadataWrapper.style.overflow = 'auto';
                }

                // Keep the container height fixed to the page frame height
                container.style.maxHeight = `${cssHeight}px`;
                container.style.height = `${cssHeight}px`;

                container.appendChild(pdfColumn);
                container.appendChild(metadataWrapper);
                document.body.appendChild(container);
            }
        }

        loadPdf();
    </script>
    <script>
      window.addEventListener("beforeunload", () => {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage("refresh-index", window.location.origin);
        }
      });
    </script>
</body>

</html>
